# Tests that present a toplevel window must hold the display's single X input
# focus, which is global: two windowed tests running in parallel would steal
# focus from each other. They run in a serial test-group while everything else
# stays parallel.

[test-groups.windowed]
max-threads = 1

# `WebKitGTK` tests each spawn a full web/network process stack over the one
# shared dbus session and display. A sibling aborting mid-run leaves orphaned
# `WebKit` processes that can wedge a concurrent spawn — run them serially
# like the windowed focus tests.
[test-groups.webview]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/renderer::focus_tests::/) | test(/applied_filter/)'
test-group = 'windowed'

[[profile.default.overrides]]
filter = 'test(/webview_system_tests::/)'
test-group = 'webview'
