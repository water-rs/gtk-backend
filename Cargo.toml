[package]
name = "waterui-gtk"
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
readme = "README.md"
repository = "https://github.com/water-rs/gtk-backend"
description = "GTK4 backend for WaterUI"
keywords = ["ui", "gtk", "waterui", "gui", "backend"]
categories = ["gui"]

[dependencies]
# Shape geometry is plain arithmetic with no GTK in it, so `shape_geometry` and
# `shape_path` compile and are tested on every host even though the rest of this
# backend is Linux only. Default features are off here: the GPU morph renderer
# is Linux-only work, and the Linux entry below turns it back on.
# Framework requirements retain one registry identity. The root patch table
# selects the unreleased compatible revision for standalone development.
waterui-shape = { version = "0.5.0", default-features = false }
kurbo = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
waterui = { version = "0.5.0", features = ["inspector"] }
waterui-core = { version = "0.5.0" }
waterui-backend-core = { version = "0.5.0", features = ["widgets", "gestures", "overlay"] }
waterui-layout = { version = "0.5.0" }
waterui-locale = { version = "0.5.0" }
waterui-navigation = { version = "0.5.0" }
waterui-text = { version = "0.5.0" }
waterui-icon = { version = "0.5.0" }
waterui-controls = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0", features = ["gpu", "cpu"] }
waterui-shape = { version = "0.5.0" }
waterui-form = { version = "0.5.0" }
waterui-webview = { version = "0.5.0", optional = true }
nami = "0.12"
# Insertion order is the eviction order for the split destination cache.
indexmap = "2"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
pin-project-lite = "0.2"
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"

# 4.14 is the floor because clipping to an arbitrary path is
# `gtk_snapshot_push_fill`, which arrived there.
gtk4 = { version = "0.11", features = ["v4_14"] }
waterui-assets = { version = "0.5.0" }
gdk4 = { version = "0.11", features = ["v4_14"] }
glib = "0.22"
# The unix-signal source API (`unix_signal_add_local`) lives in `glib-unix`,
# not `glib`, since gtk-rs 0.22. Linux-only like `glib`: on other targets
# `glib-unix-sys` probes a system GLib that is not there.
glib-unix = "0.22"
# Chromium's own physical-key table, used to name a GDK hardware keycode in the
# W3C vocabulary the surface input events carry.
keycode = "1.0"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu = "30"
# Must match the `glow` version wgpu-hal links against, or GLES handles from
# `wgpu::hal::gles` fail to unify with locally created ones.
glow = "0.17"
libloading = "0.9"
# DMA-BUF implicit-sync ioctls for the GPU surface's acquire/release fences.
libc = "0.2"

# The crates.io `waterui-*` line does not carry the nami 0.12 graph
# (water-rs/waterui#1832) yet, so every crate this graph resolves is pinned
# to the dev commit that does: the framework crates reach each other by
# path, so a registry copy beside a git twin would compile two
# `waterui-core`. Sibling components stay pinned to their own repositories,
# which require the same framework versions.
# Publishing ignores this table; it drops once the release line carries it.
[patch.crates-io]
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-meta = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
# Cherenkov and filtrate moved in-tree at the pinned waterui rev: nothing on
# the registry publishes the names below, but every entry is pinned anyway —
# a crates.io copy beside the in-tree twin would compile a second `wgpu`
# vocabulary and split the `GpuContent`/`ErasedEffect` types in two.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
cherenkov-record = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
cherenkov-shader = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
# The pinned rev moved waterui-graphics' stack to wgpu 30; every `wgpu-*` /
# `naga-*` crate it names resolves from the water-rs fork so cherenkov-gpu,
# waterui-graphics and this crate see one `wgpu` (the fork carries the
# passthrough-shader interop cherenkov-gpu's Vulkan path requires).
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
# Same rev waterui-graphics' build graph selects; a registry shaderloom would
# compile a second `naga` beside the fork.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }
# The pinned waterui rev names the same-wave waterkit rev; a registry copy
# beside it would carry the pre-rename `Signal`. Same rev waterui pins.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's. Drop once a release
# carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
waterui-webview = { version = "0.5.0", features = ["conformance"] }
# The webview system-test cases await backend events on a channel receiver
# rather than polling a flag on a timer.
async-channel = "2"
# The concrete filters the rendering tests run through `FilteredView`.
filtrate = "0.2"

# The WebKitGTK system tests are a `harness = false` binary: GTK and WebKitGTK
# must be initialised and torn down on the process's real main thread, which
# libtest — every `#[test]` runs on a throwaway worker — cannot provide. Its
# `main` owns the main thread and runs each case sequentially; nextest cannot
# enumerate its cases, so CI invokes the binary via `cargo test`.
[[test]]
name = "webview_system"
harness = false
required-features = ["webview-system"]

[features]
default = []
# The platform's own web engine, bridged as a native widget. Every other engine
# is a crate the application links and installs; this backend never names one.
webview-system = ["dep:waterui-webview", "webkitgtk"]
webkitgtk = []

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[package.metadata.cargo-machete]
ignored = ["pkg-config"]
