[package]
name = "waterui-gtk"
version = "0.2.0"
edition = "2024"
authors = ["Lexo Liu"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
readme = "README.md"
repository = "https://github.com/water-rs/gtk-backend"
description = "GTK4 backend for WaterUI"
keywords = ["ui", "gtk", "waterui", "gui", "backend"]
categories = ["gui"]

[dependencies]
# Shape geometry is plain arithmetic with no GTK in it, so `shape_geometry` and
# `shape_path` compile and are tested on every host even though the rest of this
# backend is Linux only. Default features are off here: the GPU morph renderer
# is Linux-only work, and the Linux entry below turns it back on.
# All `waterui-*` dependencies are pinned to the same `water-rs/waterui` dev
# revision: this backend tracks APIs that no crates.io release carries yet
# (water-rs/gtk-backend#4), and mixing a git copy of one crate with registry
# copies of its siblings would split shared types across two sources. The
# `version` fields are what `cargo publish` keeps after stripping `git`; a
# release therefore cannot ship until versions carrying those APIs publish.
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.1.2", default-features = false }
kurbo = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
waterui = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.4.1" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.1.2", features = ["widgets", "gestures"] }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.1.2" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.4.1" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.4.1", features = ["gpu", "cpu-scene"] }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.1.2" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.3.2" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.4.1", optional = true }
nami = "0.11.2"
# Insertion order is the eviction order for the split destination cache.
indexmap = "2"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
pin-project-lite = "0.2"
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"

# 4.14 is the floor because clipping to an arbitrary path is
# `gtk_snapshot_push_fill`, which arrived there.
gtk4 = { version = "0.11", features = ["v4_14"] }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd", version = "0.1.2" }
gdk4 = { version = "0.11", features = ["v4_14"] }
glib = "0.22"
# Chromium's own physical-key table, used to name a GDK hardware keycode in the
# W3C vocabulary the surface input events carry.
keycode = "1.0"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu = "29.0.4"
# Must match the `glow` version wgpu-hal links against, or GLES handles from
# `wgpu::hal::gles` fail to unify with locally created ones.
glow = "0.17"
libloading = "0.9"

# Extracted crates in the dependency graph (e.g. `waterui-image`) require
# `waterui-*` from crates.io while the direct dependencies above pin the
# water-rs/waterui dev revision — an unpatched graph would carry two copies of
# `waterui-core` and split the `View` trait across sources. Mirror the same
# redirect waterui's own `[patch.crates-io]` performs, pointing the duplicated
# names at the pinned checkout. `waterkit-*` crates are no longer redirected:
# they moved out of the waterui repo and its manifests at this revision take
# them from crates.io like everything else.
[patch.crates-io]
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "a5c4f13d7d012f20168227453adb95c61f4f4afd" }

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The concrete filters the rendering tests run through `AppliedFilter`.
filtrate = "0.2"

[features]
default = []
# The platform's own web engine, bridged as a native widget. Every other engine
# is a crate the application links and installs; this backend never names one.
webview-system = ["dep:waterui-webview", "webkitgtk"]
webkitgtk = []

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[package.metadata.cargo-machete]
ignored = ["pkg-config"]
