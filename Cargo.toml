[package]
name = "waterui-gtk"
version = "0.2.1"
edition = "2024"
authors = ["Lexo Liu"]
license = "Apache-2.0 OR MIT"
rust-version = "1.95"
readme = "README.md"
repository = "https://github.com/water-rs/gtk-backend"
description = "GTK4 backend for WaterUI"
keywords = ["ui", "gtk", "waterui", "gui", "backend"]
categories = ["gui"]

[dependencies]
# Shape geometry is plain arithmetic with no GTK in it, so `shape_geometry` and
# `shape_path` compile and are tested on every host even though the rest of this
# backend is Linux only. Default features are off here: the GPU morph renderer
# is Linux-only work, and the Linux entry below turns it back on.
# Framework requirements retain one registry identity. The root patch table
# selects the unreleased compatible revision for standalone development.
waterui-shape = { version = "0.5.0", default-features = false }
kurbo = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
waterui = { version = "0.5.0" }
waterui-core = { version = "0.5.0" }
waterui-backend-core = { version = "0.5.0", features = ["widgets", "gestures"] }
waterui-layout = { version = "0.5.0" }
waterui-locale = { version = "0.5.0" }
waterui-navigation = { version = "0.5.0" }
waterui-text = { version = "0.5.0" }
waterui-icon = { version = "0.5.0" }
waterui-controls = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0", features = ["gpu", "cpu-scene"] }
waterui-shape = { version = "0.5.0" }
waterui-form = { version = "0.5.0" }
waterui-webview = { version = "0.5.0", optional = true }
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26,
# `Signal::get` -> `Signal::snapshot`) is the only nami in the graph.
nami = "=0.11.1"
# Insertion order is the eviction order for the split destination cache.
indexmap = "2"
num-traits = { version = "0.2", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
pin-project-lite = "0.2"
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"

# 4.14 is the floor because clipping to an arbitrary path is
# `gtk_snapshot_push_fill`, which arrived there.
gtk4 = { version = "0.11", features = ["v4_14"] }
waterui-assets = { version = "0.5.0" }
gdk4 = { version = "0.11", features = ["v4_14"] }
glib = "0.22"
# Chromium's own physical-key table, used to name a GDK hardware keycode in the
# W3C vocabulary the surface input events carry.
keycode = "1.0"

# GPU surface dependencies (wgpu is required for graphics views & filters).
wgpu = "29.0.4"
# Must match the `glow` version wgpu-hal links against, or GLES handles from
# `wgpu::hal::gles` fail to unify with locally created ones.
glow = "0.17"
libloading = "0.9"

# The host-supplied executor refresh rate (water-rs/waterui#1201) has not
# shipped to crates.io yet, so every `waterui-*` crate this graph resolves is
# pinned to the commit that carries it: the framework crates reach each other
# by path, so a registry copy beside a git twin would compile two
# `waterui-core`. Sibling components stay pinned to their own repositories,
# which require the same framework versions.
# Publishing ignores this table; it drops once the fix is on the registry.
[patch.crates-io]
waterui-image = { git = "https://github.com/water-rs/image", rev = "324c75acb1228808fe3facb7a4b2ce7a18748610" }
waterui = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "b956632e0c4808707b9ab0e1d59e8af09c63fe8d" }
# nami#26 renames `Signal::get` to `snapshot` and removes the inherent
# `Binding::get`; the pinned waterui rev rides it. Both nami crates this
# graph names share the rev so a single `Signal` trait resolves; drop once a
# nami release carries the rename.
nami = { git = "https://github.com/water-rs/nami", rev = "5dc2d92e4ee9a236afdf71aaf4ef5b26a6990425" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "5dc2d92e4ee9a236afdf71aaf4ef5b26a6990425" }
# The pinned waterui rev names the same-wave waterkit rev; a registry copy
# beside it would carry the pre-rename `Signal`. Same rev waterui pins.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "123b0581c908d424826c4f07cd25d5c0cc0d07ec" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "123b0581c908d424826c4f07cd25d5c0cc0d07ec" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "123b0581c908d424826c4f07cd25d5c0cc0d07ec" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "123b0581c908d424826c4f07cd25d5c0cc0d07ec" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "123b0581c908d424826c4f07cd25d5c0cc0d07ec" }

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
waterui-webview = { version = "0.5.0", features = ["conformance"] }
# The webview system-test cases await backend events on a channel receiver
# rather than polling a flag on a timer.
async-channel = "2"
# The concrete filters the rendering tests run through `AppliedFilter`.
filtrate = "0.2"

# The WebKitGTK system tests are a `harness = false` binary: GTK and WebKitGTK
# must be initialised and torn down on the process's real main thread, which
# libtest — every `#[test]` runs on a throwaway worker — cannot provide. Its
# `main` owns the main thread and runs each case sequentially; nextest cannot
# enumerate its cases, so CI invokes the binary via `cargo test`.
[[test]]
name = "webview_system"
harness = false
required-features = ["webview-system"]

[features]
default = []
# The platform's own web engine, bridged as a native widget. Every other engine
# is a crate the application links and installs; this backend never names one.
webview-system = ["dep:waterui-webview", "webkitgtk"]
webkitgtk = []

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[package.metadata.cargo-machete]
ignored = ["pkg-config"]
