name: Release preflight

# crates.io versions are immutable, so the one unrecoverable mistake is
# publishing a version number that already exists while the crate behind it has
# changed. release-plz runs this check when preparing a release PR; this job
# exists so it cannot silently lapse.

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Local API vs published baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # cargo-semver-checks builds the crate's rustdoc, and the crate links
      # GTK4.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev \
            libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev \
            libxkbcommon-dev libwebkitgtk-6.0-dev
      # cargo-semver-checks pins the baseline to an exact version, so it needs a
      # published version that still resolves — a crate can be in the index with
      # every version yanked, and then there is nothing to compare against.
      - id: baseline
        run: |
          set -euo pipefail
          if curl -sfL https://index.crates.io/wa/te/waterui-gtk | grep -q '"yanked":false'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No unyanked waterui-gtk on crates.io; this release establishes the baseline."
          fi
      - if: steps.baseline.outputs.exists == 'true'
        id: git-deps
        run: |
          # While `waterui-*` dependencies are git-pinned (plus the
          # `[patch.crates-io]` redirect that keeps one copy of each in the
          # graph), semver-checks cannot compare against a registry baseline:
          # it builds the crate through a harness project where `[patch]` does
          # not apply, and the baseline's `waterui-core` would be a different
          # source than the current one anyway. The publish gate still holds —
          # `cargo publish` strips `git`/`[patch]` and the dry-run verify
          # compiles against the registry versions.
          if grep -q 'git = "https://github.com/water-rs/waterui"' Cargo.toml; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Semver baseline skipped::waterui-* dependencies are git-pinned; API-vs-registry-baseline comparison is invalid until they return to registry deps."
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.baseline.outputs.exists == 'true' && steps.git-deps.outputs.pinned == 'false'
        uses: obi1kenobi/cargo-semver-checks-action@v2
