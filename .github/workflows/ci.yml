name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds are one-shot: the incremental database is dead weight in every
  # cache entry, and dev/test debuginfo is the largest single contributor to
  # target-dir size on a sys-crate-heavy dependency tree.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # llvmpipe (software rasterizer) gives the GL context GPU-path code needs
  # without a display server GPU.
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe

jobs:
  bump:
    # release-plz bump pull requests (`release-plz-*` heads) change only
    # versions and the changelog, so this job skips itself and every other
    # job skips through `needs: bump`.
    name: Not a release bump
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} is not a release bump"

  test:
    name: Test / ${{ matrix.features }}
    needs: bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: xvfb libgl1-mesa-dri openbox dbus-x11 xdotool
      # The two matrix legs compile different feature sets into disjoint
      # artifacts; without a per-leg key they race to save under one key and
      # whichever lands second wins, leaving the other leg permanently cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.features }}
      - uses: taiki-e/install-action@nextest
      # Focus tests need the toplevel to actually hold input focus, which no
      # window gets under bare Xvfb: a minimal WM (openbox) grants it. The
      # windowed tests serialize through nextest's `windowed` test-group.
      - name: cargo nextest run
        if: matrix.features == 'default'
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox & sleep 2; cargo nextest run'
      - name: cargo nextest run --all-features
        if: matrix.features == 'all-features'
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox & sleep 2; cargo nextest run --all-features'
      # The WebKitGTK system tests are a `harness = false` binary — GTK and
      # WebKitGTK must own the process main thread, which libtest cannot
      # provide, so nextest cannot enumerate its cases. Run it through
      # `cargo test` under the same xvfb/dbus/WM wrapper; `timeout` is the
      # process watchdog nextest's `webview` test-group provided, since a
      # synchronous native stall outlives the inner async bound.
      - name: cargo test --test webview_system --all-features
        if: matrix.features == 'all-features'
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox & sleep 2; timeout 120 cargo test -p waterui-gtk --test webview_system --all-features'

  lint:
    name: Lint
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/setup-linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The WebKitGTK-linked shape is a different body of code (the FFI layer
      # only exists when pkg-config finds webkitgtk-6.0); lint both.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. Without this env var the job
          # compiled on `stable` and proved nothing about the floor.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: ./.github/actions/setup-linux-deps
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      - run: cargo check --all-features

  # Every host but Linux compiles this crate to an empty library; keep that
  # boundary compiling so cross-platform workspaces can depend on it.
  non-linux:
    name: Non-Linux stub / ${{ matrix.os }}
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - run: cargo check --all-targets --all-features

  result:
    # The single check the `main` ruleset requires: it passes when every
    # job passed or was skipped (release-plz bump pull requests skip all).
    name: CI result
    if: always()
    needs: [bump, test, lint, msrv, non-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi
