name: Release

on:
  # Publishing runs on the `main` push — the deliberate dev -> main
  # release merge, whose required checks already passed on the same
  # tree. `release-pr` still waits for CI on `dev` via `workflow_run`,
  # since the release-plz bump PRs target the dev branch.
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # `cargo publish` verify-compiles the crate, and the crate links GTK4.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libasound2-dev libva-dev libfontconfig1-dev \
            libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev \
            libxkbcommon-dev libwebkitgtk-6.0-dev
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured for the crate on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev'
    concurrency:
      group: release-plz-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
