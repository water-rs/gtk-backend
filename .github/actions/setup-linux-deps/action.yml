name: Setup Linux native dependencies
description: >
  Installs (and caches across runs) the native libraries a Linux build of the
  backend needs: audio (ALSA, PipeWire), video (VA-API, nasm-assembled
  codecs), fonts, GTK4, WebKitGTK, EGL, udev, and the software Vulkan stack.
  Every job that builds on Linux needs this same list, so it lives here once
  instead of three independent `apt-get` invocations drifting apart.

inputs:
  extra-packages:
    description: >
      Further Ubuntu packages one job needs on top of the shared list, so the
      job installs them through the same cached, verified path.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The runner image is baked, not live, so `/var/lib/apt/lists` is as old as
    # the image. cache-apt-pkgs-action deliberately never refreshes it on a
    # GitHub-hosted runner ("GitHub Actions runners have fresh package lists",
    # in its lib.sh), so once Ubuntu supersedes any transitive dependency of the
    # list below, the baked index still names a .deb that has left the pool,
    # every fetch 404s, and `apt-fast` exits 0 anyway — leaving that step green
    # with nothing installed. Resolve against an index that matches the mirror.
    - uses: ./.github/actions/refresh-apt-index

    - name: Compute package list
      id: pkgs
      shell: bash
      run: |
        # mesa-vulkan-drivers + libvulkan1 are the software Vulkan stack
        # (llvmpipe/lavapipe) the GPU-backed tests exercise headlessly.
        packages="nasm libasound2-dev libva-dev libfontconfig1-dev libgbm-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev libegl-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers libvulkan1 libwebkitgtk-6.0-dev"
        if [ -n "${{ inputs.extra-packages }}" ]; then
          packages="$packages ${{ inputs.extra-packages }}"
        fi
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

    # cache-apt-pkgs-action caches the downloaded .debs and restores them with
    # `dpkg -i` instead of hitting the network apt mirror on every job. It
    # skips postinst scripts by default (`execute_install_scripts: false`);
    # we turn that on because several of these packages are shared libraries
    # whose postinst runs ldconfig, and a plain `dpkg -i` restore without it
    # leaves the linker cache stale until something else happens to rebuild
    # it. Pinned to a release tag rather than the floating `@v1` for the same
    # reason an unpinned action changing behavior underneath a caching step is
    # a hard failure mode to diagnose.
    - name: Install native dependencies
      id: apt
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: ${{ steps.pkgs.outputs.packages }}
        version: "1.0"
        execute_install_scripts: true

    # ...and check what it did, because the action cannot fail on its own: a
    # fetch error leaves it reporting success over an empty package set, and the
    # next thing to notice is a cargo build twenty minutes later blaming
    # whichever pkg-config crate it happened to reach first.
    #
    # Two sources, because neither alone covers every package. The action's
    # `all-package-version-list` is what it unpacked or restored from its cache,
    # and a cache restore is a plain untar that never reaches dpkg's database.
    # dpkg covers the rest: a package the runner image already ships is never
    # unpacked and so never appears in that list.
    - name: Verify native dependencies are installed
      shell: bash
      env:
        REQUESTED: ${{ steps.pkgs.outputs.packages }}
        UNPACKED: ${{ steps.apt.outputs.all-package-version-list }}
      run: |
        missing=""
        for package in $REQUESTED; do
          case ",$UNPACKED," in
            *",$package="*) continue ;;
          esac
          status="$(dpkg-query --show --showformat='${Status}' "$package" 2>/dev/null || true)"
          if [ "$status" != "install ok installed" ]; then
            missing="$missing $package"
          fi
        done
        if [ -n "$missing" ]; then
          echo "::error::apt reported success but did not install:$missing"
          exit 1
        fi
